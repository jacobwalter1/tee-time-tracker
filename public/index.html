<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search available tee times around Des Moines.">
  <title>Golf Search</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">DES MOINES AREA</p>
      <h1>Find your next tee time.</h1>
      <p class="intro">Search seven local courses at once, narrow the list, then jump directly to the course to book.</p>
    </header>

    <section class="search-panel" aria-labelledby="search-title">
      <h2 id="search-title" class="sr-only">Search tee times</h2>
      <form id="search-form">
        <label><span>Date</span><input id="date" name="date" type="date" required></label>
        <button class="primary-button" type="submit"><span>Search tee times</span><span aria-hidden="true">→</span></button>
      </form>
      <div class="filters" aria-label="Filter tee times">
        <label><span>Course</span><select id="course-filter"><option value="">All courses</option></select></label>
        <label>
          <span>Golfers</span>
          <select id="players-filter">
            <option value="0">Any availability</option>
            <option value="1">At least 1</option>
            <option value="2">At least 2</option>
            <option value="3">At least 3</option>
            <option value="4">At least 4</option>
          </select>
        </label>
        <label><span>Earliest</span><select id="start-filter"></select></label>
        <label><span>Latest</span><select id="end-filter"></select></label>
      </div>
    </section>

    <section class="results-section" aria-live="polite" aria-busy="false">
      <div class="results-heading">
        <div>
          <p id="result-kicker" class="eyebrow">READY TO SEARCH</p>
          <h2 id="result-title">Choose a date to get started</h2>
        </div>
        <button id="clear-filters" class="text-button" type="button">Reset filters</button>
      </div>
      <div id="status" class="status">Tee times are checked live, so a full search may take about a minute.</div>
      <div id="course-errors" class="course-errors" hidden></div>
      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <template id="tee-time-template">
    <a class="tee-card" target="_blank" rel="noopener noreferrer">
      <div><p class="card-course"></p><p class="card-time"></p></div>
      <div class="card-meta">
        <div class="card-details">
          <span class="card-players"></span>
          <span class="card-price"></span>
        </div>
        <span class="book-label">Book <span aria-hidden="true">↗</span></span>
      </div>
    </a>
  </template>
  <script src="/app.js" defer></script>
</body>
</html>
